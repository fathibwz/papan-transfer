<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Papan Transfer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f1f2f4);--card:var(--tg-theme-bg-color,#fff);
  --tx:var(--tg-theme-text-color,#16181d);--mut:var(--tg-theme-hint-color,#7a7f88);
  --acc:var(--tg-theme-button-color,#2f6fdb);--acc-tx:var(--tg-theme-button-text-color,#fff);
  --line:color-mix(in srgb,var(--tx) 12%,transparent);--soft:color-mix(in srgb,var(--tx) 6%,transparent);
  --ok:#1f8a4c;--bad:#c93b3b;--warn:#a86a00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 40px}
.top{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.top h1{font-size:18px;font-weight:600;margin:0;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 14px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.chip b{color:var(--tx);font-weight:600}
.btn-r{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;height:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.sec{margin:18px 2px 8px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:6px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 12px}
.gh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--acc);color:var(--acc-tx);font-weight:600}
.gh .alat{margin-left:auto;font-size:12px;font-weight:500;opacity:.9}
.gh.x{background:var(--warn)}
.it{padding:12px 14px;border-top:1px solid var(--line)}
.gh+.it{border-top:0}
.tx{white-space:pre-line;word-break:break-word}
.tx .nr{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;background:var(--soft);padding:0 4px;border-radius:5px;cursor:copy}
.tx .rp{font-weight:600}
.meta{font-size:12px;color:var(--mut);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.warn{font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.warn.merah{color:var(--bad)}.warn.kuning{color:var(--warn)}
.bar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ic{position:relative;width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:19px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ic:hover{background:var(--soft)}
.ic.ok{color:var(--ok)}.ic.no{color:var(--bad)}.ic.pr{color:var(--acc)}
.ic[data-tip]:hover::after,.ic.tipon::after{content:attr(data-tip);position:absolute;bottom:42px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--tx);color:var(--card);font-size:12px;padding:4px 8px;border-radius:6px;z-index:9;pointer-events:none}
.bar .ic:first-child::after{left:0 !important;transform:none !important}
.mini{padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;font-size:14px}
.mini:first-child{border-top:0}
.mini .n{font-size:12px;color:var(--mut);min-width:58px}
.mini .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .a{font-weight:600;white-space:nowrap}
.mini .s{font-size:12px;color:var(--mut);white-space:nowrap}
.mini.ditolak .w{text-decoration:line-through;color:var(--mut)}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.empty{padding:14px;color:var(--mut);font-size:14px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tx);color:var(--card);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.err{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut)}
.sd{padding:9px 14px;border-top:1px solid var(--line)}
.sd:first-child{border-top:0}
.sd .mini{padding:0;border:0}
.sd .bar{margin-top:6px}
.ic.sm{width:36px;height:32px;font-size:17px}
.ic:disabled{opacity:.45;cursor:wait}
.lihat{font-size:12px;color:var(--mut);margin:-6px 2px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="judul">Transfer</h1><button class="btn-r" onclick="muat(true)" aria-label="Segarkan"><i class="ti ti-refresh"></i><span id="jam">…</span></button></div>
  <div class="chips" id="chips"></div>
  <div id="isi"><div class="err">Memuat papan…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API = 'https://wick-unlined-gooey.ngrok-free.dev/webhook/papan-api';
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
let D = null, sibuk = false;
const HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'], BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rp = n => Number(n || 0).toLocaleString('id-ID');
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 1800); }
function salin(t, lbl) { const ok = () => toast(lbl + ' disalin'); if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => fallback()); else fallback(); function fallback() { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Gagal menyalin'); } a.remove(); } }
function nomor(x) { return x.tgl === D.hari ? x.no : (x.nomor || x.no); }
function teksHtml(x) {
  return esc(x.teks).replace(/\b(\d[\d ]{8,}\d)\b/g, m => '<span class="nr" data-c="' + m.replace(/\D/g, '') + '" title="Ketuk untuk salin">' + m + '</span>')
    .replace(/(Rp\.?\s?[\d.,]+)/gi, '<span class="rp">$1</span>');
}
function ikon(cls, icon, tip, aksi, id) { return '<button class="ic ' + cls + '" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '" data-a="' + aksi + '" data-id="' + esc(id) + '"><i class="ti ti-' + icon + '"></i></button>'; }
function barBelum(x) {
  if (D.peran !== 'pemilik') return '';
  const b = [];
  if (x.telp) b.push(ikon('pr', 'phone', 'Sudah telepon ' + (x.manager || 'manager'), 'tel', x.id));
  else {
    if (x.ketik) b.push(ikon('pr', 'keyboard', x.jenis === 'cardless' ? 'Buat kode cardless otomatis' : 'Ketik otomatis di ' + (x.sumber.alat || 'perangkat'), x.ketik, x.id));
    b.push(ikon('ok', 'check', 'Sudah ditransfer', 'ok', x.id));
  }
  if (x.norek) b.push(ikon('', 'copy', 'Salin nomor rekening', 'salin', x.id));
  b.push(ikon('no', 'x', 'Tolak', 'tolak', x.id));
  return '<div class="bar">' + b.join('') + '</div>';
}
function itemHtml(x, bar) {
  const w = (x.peringatan || []).map(p => '<div class="warn ' + p.lv + '"><i class="ti ti-alert-triangle"></i><span>' + esc(p.t) + '</span></div>').join('');
  const tel = x.telp ? '<div class="warn kuning"><i class="ti ti-phone"></i><span>Telepon ' + esc(x.manager || 'manager') + (x.teleponManager ? ' · <a href="tel:' + esc(x.teleponManager) + '">' + esc(x.teleponManager) + '</a>' : '') + '</span></div>' : '';
  const lain = x.bankLain ? '<div class="warn kuning"><i class="ti ti-building-bank"></i><span>Bukan BCA — lewat Flip</span></div>' : '';
  return '<div class="it"><div class="tx">' + teksHtml(x) + '</div>' + w + tel + lain +
    '<div class="meta"><span>' + esc(nomor(x)) + '</span><span>masuk ' + esc(x.tgl === D.hari ? x.jam : x.tgl.slice(8, 10) + '/' + x.tgl.slice(5, 7) + ' ' + x.jam) + '</span>' + (x.pemohon ? '<span>' + esc(x.pemohon) + '</span>' : '') + '</div>' + (bar || '') + '</div>';
}
function kelompok(list) {
  const g = {}; list.forEach(x => { const k = x.sumber.kunci + '|' + (x.jenis === 'cardless' ? 'c' : 't'); (g[k] = g[k] || []).push(x); });
  return Object.values(g).sort((a, b) => a[0].urut - b[0].urut || (a[0].jenis === 'cardless') - (b[0].jenis === 'cardless'));
}
function grupHtml(list, bar) {
  return kelompok(list).map(L => { const s = L[0].sumber, tot = L.reduce((a, x) => a + x.nominal, 0);
    return '<div class="grp"><div class="gh' + (s.kunci === 'X' ? ' x' : '') + '"><i class="ti ti-' + (L[0].jenis === 'cardless' ? 'cash' : 'building-bank') + '"></i>From ' + esc(s.judul) + '<span class="alat">' + esc(s.alat || '') + ' · ' + rp(tot) + '</span></div>' + L.map(x => itemHtml(x, bar ? barBelum(x) : '')).join('') + '</div>'; }).join('');
}
function miniHtml(x, akhir) { return '<div class="mini' + (x.status === 'ditolak' ? ' ditolak' : '') + '"><span class="n">' + esc(nomor(x)) + '</span><span class="w">' + esc(x.jenis === 'cardless' ? 'Tarik tunai' : (x.nama || x.teks.split('\n')[0])) + '</span><span class="a">' + rp(x.nominal) + '</span><span class="s">' + akhir + '</span></div>'; }
function sudahHtml(x) {
  const akhir = esc(x.jamTransfer) + ' · ' + (x.bukti ? (x.jenis === 'cardless' ? 'kode ✓' : 'bukti ✓') : '<span style="color:var(--warn)">' + (x.jenis === 'cardless' ? 'kode belum' : 'bukti belum') + '</span>');
  if (D.peran !== 'pemilik') return miniHtml(x, akhir);
  const b = [];
  if (!x.bukti) {
    if (x.buktiAksi === 'bk') b.push(ikon('pr sm', 'send', 'Kirim bukti otomatis dari tablet', 'bk', x.id));
    else if (x.buktiAksi === 'kk') b.push(ikon('pr sm', 'send', 'Kirim kode cardless otomatis', 'kk', x.id));
    else b.push(ikon('pr sm', 'paperclip', 'Minta saya kirim foto bukti', 'mb', x.id));
    b.push(ikon('sm', 'arrow-back-up', 'Batalkan centang (maks 5 menit)', 'un', x.id));
  }
  return '<div class="sd">' + miniHtml(x, akhir) + (b.length ? '<div class="bar">' + b.join('') + '</div>' : '') + '</div>';
}
function render() {
  const d = new Date(D.hari + 'T00:00:00');
  document.getElementById('judul').textContent = 'Transfer · ' + HARI[d.getDay()] + ' ' + d.getDate() + ' ' + BLN[d.getMonth()];
  document.getElementById('jam').textContent = D.dibuat.slice(11, 16);
  const tunggu = D.sudah.filter(x => !x.bukti).length;
  document.getElementById('chips').innerHTML = [['Belum', D.belum.length], ['Di Linda', D.linda.length], ['Sudah', D.sudah.length], ['Tunggu bukti', tunggu], ['Tertunda', D.tertunda.length]]
    .map(c => '<span class="chip">' + c[0] + ' <b>' + c[1] + '</b></span>').join('');
  let h = D.peran === 'lihat' ? '<div class="lihat"><i class="ti ti-eye"></i> Mode lihat saja</div>' : '';
  h += '<div class="sec"><i class="ti ti-hourglass"></i>Belum transfer</div>' + (D.belum.length ? grupHtml(D.belum, true) : '<div class="grp"><div class="empty">Tidak ada yang menunggu transfer.</div></div>');
  if (D.linda.length) h += '<div class="sec"><i class="ti ti-player-pause"></i>Menunggu cek Linda</div>' + grupHtml(D.linda, false);
  h += '<div class="sec"><i class="ti ti-circle-check"></i>Sudah ditransfer</div><div class="grp">' + (D.sudah.length ? D.sudah.slice().sort((a, b) => b.jamTransfer.localeCompare(a.jamTransfer)).map(sudahHtml).join('') : '<div class="empty">Belum ada.</div>') + '</div>';
  if (D.ditolak.length) h += '<div class="sec"><i class="ti ti-ban"></i>Ditolak</div><div class="grp">' + D.ditolak.map(x => miniHtml(x, 'ditolak')).join('') + '</div>';
  if (D.tertunda.length) h += '<details><summary class="sec"><i class="ti ti-chevron-right"></i>Tertunda dari hari sebelumnya (' + D.tertunda.length + ')</summary><div class="grp">' + D.tertunda.map(x => miniHtml(x, x.tgl.slice(8, 10) + '/' + x.tgl.slice(5, 7) + (x.status === 'menunggu_invoice' ? ' · di Linda' : ''))).join('') + '</div></details>';
  document.getElementById('isi').innerHTML = h;
}
let beraksi = false;
async function muat(manual) {
  if (sibuk || (beraksi && !manual)) return; sibuk = true;
  try {
    const init = (tg && tg.initData) || '';
    const r = await fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain', 'ngrok-skip-browser-warning': '1' }, body: JSON.stringify({ initData: init, aksi: 'papan' }) });
    const j = await r.json().catch(() => null);
    if (!j || !j.ok) { document.getElementById('isi').innerHTML = '<div class="err">' + esc((j && j.alasan) || 'Papan tidak bisa dimuat (server ' + r.status + ').') + '</div>'; return; }
    D = j; render(); if (manual) toast('Diperbarui');
  } catch (e) { document.getElementById('isi').innerHTML = '<div class="err">Tidak tersambung ke server bot. Pastikan komputer n8n menyala.</div>'; }
  finally { sibuk = false; }
}
document.addEventListener('click', e => {
  const n = e.target.closest('.nr'); if (n) { salin(n.dataset.c, 'Nomor rekening'); return; }
  const b = e.target.closest('.ic'); if (!b) return;
  const x = D && [...D.belum, ...D.linda].find(i => i.id === b.dataset.id);
  if (b.dataset.a === 'salin' && x) { salin(x.norek, 'Nomor rekening'); return; }
  if (!D || D.peran !== 'pemilik' || !b.dataset.a) return;
  const y = x || D.sudah.find(i => i.id === b.dataset.id);
  if (!y) return;
  const a = b.dataset.a, no = nomor(y), nm = y.jenis === 'cardless' ? 'tarik tunai' : (y.nama || ''), nom = 'Rp ' + rp(y.nominal);
  const tanya = { ok: 'Tandai ' + no + ' (' + nm + ', ' + nom + ') SUDAH DITRANSFER?', tolak: 'TOLAK ' + no + ' (' + nm + ', ' + nom + ')?', tel: 'Sudah menelepon ' + (y.manager || 'manager') + ' untuk ' + no + '?', un: 'Batalkan centang ' + no + '? (hanya ≤ 5 menit dan belum ada bukti)' }[a];
  if (tanya) konfirmasi(tanya, ya => { if (ya) kirim(a, y.id, b); }); else kirim(a, y.id, b);
});
function konfirmasi(t, cb) { if (tg && tg.showConfirm) { try { tg.showConfirm(t, cb); return; } catch (e) {} } cb(window.confirm(t)); }
function kabar(t, keras) { if (!t) return; if (keras && tg && tg.showAlert) { try { tg.showAlert(t); return; } catch (e) {} } toast(t); }
async function kirim(act, id, btn) {
  if (beraksi) { toast('Tunggu, perintah sebelumnya masih berjalan…'); return; }
  beraksi = true; if (btn) btn.disabled = true; toast('Mengirim…');
  try {
    const r = await fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain', 'ngrok-skip-browser-warning': '1' }, body: JSON.stringify({ initData: (tg && tg.initData) || '', aksi: 'tombol', act: act, id: id }) });
    const j = await r.json().catch(() => null);
    if (j && j.ok === false) kabar(j.pesan || j.alasan || 'Perintah tidak dijalankan.', true);
    else if (j && j.pesan) kabar(j.pesan, j.peringatan || j.pesan.length > 60);
    else if (j && j.ok) toast('Selesai');
    else kabar('Server menjawab ' + r.status + '. Coba lagi.', true);
  } catch (e) { kabar('Tidak tersambung ke server bot. Pastikan komputer n8n menyala.', true); }
  finally { beraksi = false; if (btn) btn.disabled = false; setTimeout(() => muat(), 700); }
}
let tekan; document.addEventListener('touchstart', e => { const b = e.target.closest('.ic'); if (!b) return; tekan = setTimeout(() => { b.classList.add('tipon'); setTimeout(() => b.classList.remove('tipon'), 1500); }, 450); }, { passive: true });
document.addEventListener('touchend', () => clearTimeout(tekan));
muat(); setInterval(() => { if (!document.hidden) muat(); }, 30000);
</script>
</body>
</html>
